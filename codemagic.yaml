workflows:
  android-debug:
    name: OptiCore Atletas - Debug APK
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      flutter: 3.24.5
      java: 17
    scripts:
      - name: Obtener dependencias
        script: flutter pub get
      - name: Compilar APK debug
        script: flutter build apk --debug --android-skip-build-dependency-validation
    artifacts:
      - build/**/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - cabalforalways@gmail.com
        notify:
          success: true
          failure: true
