workflows:

  # DEBUG: APK para instalar directamente en el dispositivo
  android-debug:
    name: OptiCore Atletas - Debug APK
    max_build_duration: 30
    instance_type: linux_x2

    environment:
      flutter: stable
      java: 17

    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/.gradle/caches

    scripts:
      - name: Obtener dependencias
        script: flutter pub get

      - name: Analizar codigo
        script: flutter analyze --no-fatal-infos

      - name: Compilar APK debug
        script: flutter build apk --debug

    artifacts:
      - build/**/outputs/**/*.apk

    publishing:
      email:
        recipients:
          - carlos@opticore.bo
        notify:
          success: true
          failure: true

  # RELEASE: AAB firmado para Google Play Store
  android-release:
    name: OptiCore Atletas - Play Store Release
    max_build_duration: 45
    instance_type: linux_x2

    environment:
      flutter: stable
      java: 17
      # Referencia al keystore subido en Codemagic
      # Team settings -> Code signing identities -> Android keystores
      android_signing:
        - opticore_atletas_key

    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/.gradle/caches

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true

    scripts:
      - name: Obtener dependencias
        script: flutter pub get

      - name: Analizar codigo
        script: flutter analyze --no-fatal-infos

      - name: Compilar AAB firmado para Play Store
        script: |
          flutter build appbundle --release \
            --build-name=1.0.$PROJECT_BUILD_NUMBER \
            --build-number=$PROJECT_BUILD_NUMBER

    artifacts:
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/*.apk
      - build/**/outputs/**/mapping.txt

    publishing:
      email:
        recipients:
          - carlos@opticore.bo
        notify:
          success: true
          failure: true
